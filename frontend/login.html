<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - Azer ERP</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #f8fafc;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            box-sizing: border-box;
            animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            border-radius: 16px;
            font-size: 32px;
            margin-bottom: 16px;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .login-title {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .login-subtitle {
            margin: 6px 0 0;
            font-size: 13px;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid #334155;
            border-radius: 10px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .form-input:focus {
            border-color: #3b82f6;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .form-input::placeholder {
            color: #64748b;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper .form-input {
            padding-right: 44px;
        }

        .toggle-password-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            padding: 6px;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .toggle-password-btn:hover {
            color: #f8fafc;
            background: rgba(255, 255, 255, 0.1);
        }

        .toggle-password-btn svg {
            width: 20px;
            height: 20px;
        }

        .form-hint {
            display: block;
            margin-top: 5px;
            font-size: 11px;
            color: #64748b;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-alert {
            display: none;
            padding: 12px 14px;
            border-radius: 8px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            font-size: 13px;
            margin-bottom: 20px;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.4;
        }

        .moysklad-info {
            margin-top: 24px;
            padding: 12px 16px;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            border-radius: 10px;
            font-size: 12px;
            color: #93c5fd;
            text-align: center;
            line-height: 1.6;
        }

        .moysklad-info .ms-logo {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            color: #60a5fa;
            font-size: 13px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo-icon">📊</div>
            <h1 class="login-title">Azer ERP</h1>
            <p class="login-subtitle">MoySklad hisobingiz orqali tizimga kiring</p>
        </div>

        <div id="login-alert" class="login-alert">
            <span style="font-size: 16px;">⚠️</span>
            <span id="alert-text">Login yoki parol noto'g'ri</span>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="username">MoySklad Login</label>
                <input type="text" id="username" class="form-input" placeholder="admin@company" required autocomplete="username" spellcheck="false" autofocus>
                <span class="form-hint">Format: <strong>login@kompaniya_nomi</strong> (masalan: admin@azer)</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">MoySklad Parol</label>
                <div class="password-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="Parolingizni kiriting" required autocomplete="current-password">
                    <button type="button" id="toggle-pwd-btn" class="toggle-password-btn" onclick="togglePasswordVisibility()" title="Parolni ko'rsatish" aria-label="Parolni ko'rsatish" tabindex="-1">
                        <!-- Eye Open Icon (Default) -->
                        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <!-- Eye Slash Icon (Hidden initially) -->
                        <svg id="eye-slash-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="btn-submit">
                🔐 Tizimga Kirish
            </button>
        </form>

        <div class="moysklad-info">
            <div class="ms-logo">🏢 MoySklad Autentifikatsiya</div>
            MoySklad tizimiga kirishda ishlatadigan <strong>login va parolingizni</strong> kiriting.<br>
            Kirish formati: <strong>login@kompaniya_nomi</strong>
        </div>
    </div>

    <script>
        // Agar allaqachon kirilgan bo'lsa, to'g'ridan-to'g'ri dashboard'ga o'tish
        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            const eyeSlashIcon = document.getElementById('eye-slash-icon');
            const toggleBtn = document.getElementById('toggle-pwd-btn');

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.style.display = 'none';
                eyeSlashIcon.style.display = 'block';
                toggleBtn.title = "Parolni yashirish";
                toggleBtn.setAttribute('aria-label', "Parolni yashirish");
            } else {
                pwdInput.type = 'password';
                eyeIcon.style.display = 'block';
                eyeSlashIcon.style.display = 'none';
                toggleBtn.title = "Parolni ko'rsatish";
                toggleBtn.setAttribute('aria-label', "Parolni ko'rsatish");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const alertEl = document.getElementById('login-alert');
            const alertText = document.getElementById('alert-text');
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;

            if (!u || !p) {
                alertText.textContent = "Login va parolni to'liq kiriting";
                alertEl.style.display = 'flex';
                return;
            }

            alertEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = '🔄 MoySklad bilan tekshirilmoqda...';

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p }),
                });

                const data = await resp.json();
                if (!resp.ok) {
                    throw new Error(data.detail || "Login yoki parol noto'g'ri");
                }

                localStorage.setItem('token', data.access_token);
                localStorage.setItem('user', JSON.stringify(data.user));

                btn.textContent = '✅ Muvaffaqiyatli!';
                setTimeout(() => {
                    window.location.href = '/';
                }, 300);
            } catch (err) {
                alertText.textContent = err.message;
                alertEl.style.display = 'flex';
                btn.disabled = false;
                btn.textContent = '🔐 Tizimga Kirish';
            }
        }
    </script>
</body>
</html>
