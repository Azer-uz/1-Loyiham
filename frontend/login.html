<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - Azer</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #f8fafc;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            box-sizing: border-box;
            animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            border-radius: 16px;
            font-size: 32px;
            margin-bottom: 16px;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .login-title {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .login-subtitle {
            margin: 6px 0 0;
            font-size: 13px;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid #334155;
            border-radius: 10px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .form-input:focus {
            border-color: #3b82f6;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .form-input::placeholder {
            color: #64748b;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-alert {
            display: none;
            padding: 12px 14px;
            border-radius: 8px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            font-size: 13px;
            margin-bottom: 20px;
            align-items: center;
            gap: 8px;
        }

        .default-credentials {
            margin-top: 24px;
            padding: 12px 16px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 10px;
            font-size: 12px;
            color: #93c5fd;
            text-align: center;
            line-height: 1.5;
        }

        .default-credentials strong {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo-icon">📊</div>
            <h1 class="login-title">Azer</h1>
            <p class="login-subtitle">Tizimga kirish uchun login va parolingizni kiriting</p>
        </div>

        <div id="login-alert" class="login-alert">
            <span>⚠️</span>
            <span id="alert-text">Login yoki parol noto'g'ri</span>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="username">Login</label>
                <input type="text" id="username" class="form-input" placeholder="admin" required value="admin" autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Parol</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required value="admin123" autocomplete="current-password">
            </div>

            <button type="submit" id="submit-btn" class="btn-submit">
                Tizimga Kirish
            </button>
        </form>

        <div class="default-credentials">
            Standart ma'lumotlar:<br>
            Login: <strong>admin</strong> &nbsp;|&nbsp; Parol: <strong>admin123</strong>
        </div>
    </div>

    <script>
        // Agar allaqachon kirilgan bo'lsa, to'g'ridan-to'g'ri dashboard'ga o'tish
        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const alertEl = document.getElementById('login-alert');
            const alertText = document.getElementById('alert-text');
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;

            alertEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Tekshirilmoqda...';

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p }),
                });

                const data = await resp.json();
                if (!resp.ok) {
                    throw new Error(data.detail || "Login yoki parol noto'g'ri");
                }

                localStorage.setItem('token', data.access_token);
                localStorage.setItem('user', JSON.stringify(data.user));

                btn.textContent = 'Muvaffaqiyatli!';
                setTimeout(() => {
                    window.location.href = '/';
                }, 300);
            } catch (err) {
                alertText.textContent = err.message;
                alertEl.style.display = 'flex';
                btn.disabled = false;
                btn.textContent = 'Tizimga Kirish';
            }
        }
    </script>
</body>
</html>
